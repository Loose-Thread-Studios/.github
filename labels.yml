#Repository labels. Labels say what kind of issue it is and why it is blocked.
#Area, milestone and priority are board fields instead (see README.md), so they aren't repeated here.
#Apply with a label-sync action or by hand: gh label create "<name>" --color <color> --description "<description>"
- name: "type: bug"
  color: "d73a4a"
  description: "The build behaves wrongly"
- name: "type: feature"
  color: "0e8a16"
  description: "A mechanic, system or piece of content to build or change"
- name: "type: asset"
  color: "a371f7"
  description: "A sprite, animation, sound or UI element"
- name: "type: design"
  color: "fbca04"
  description: "A GDD question or decision to make, not code"
- name: "type: playtest"
  color: "1d76db"
  description: "A play session to run and record in the GDD Results log"
- name: "type: chore"
  color: "c5def5"
  description: "Tooling, project settings, cleanup"
- name: "status: needs-triage"
  color: "ededed"
  description: "New, not yet given an area, milestone and priority"
- name: "status: needs-decision"
  color: "e99695"
  description: "Waiting on an Open GDD decision from the developer"
- name: "status: blocked"
  color: "b60205"
  description: "Can't move until another issue is done"
- name: "world-wrap"
  color: "5319e7"
  description: "Touches positions across the wrap seam; test both sides"
- name: "good first issue"
  color: "7057ff"
  description: "Small and self-contained, good for a new teammate"
